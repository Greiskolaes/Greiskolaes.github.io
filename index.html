<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"comforting-ground-beef-goulash":"https://laurameals.com/comforting-ground-beef-goulash/","creamy-one-pot-beef-shells":"https://laurameals.com/creamy-one-pot-beef-shells/","crockpot-meatloaf":"https://laurameals.com/crockpot-meatloaf/","crockpot-rotel-dip-with-ground-beef":"https://laurameals.com/crockpot-rotel-dip-with-ground-beef/","dirty-rice-with-ground-beef":"https://laurameals.com/dirty-rice-with-ground-beef/","easy-ground-beef-potato":"https://laurameals.com/easy-ground-beef-potato/","french-onion-ground-beef-rice-casserole":"https://laurameals.com/french-onion-ground-beef-rice-casserole/","garlic-parmesan-bowtie-pasta-with-beef":"https://laurameals.com/garlic-parmesan-bowtie-pasta-with-beef/","ground-beef-and-dumplings":"https://laurameals.com/ground-beef-and-dumplings/","ground-beef-enchiladas-one-pan-meal-for-the-family":"https://laurameals.com/ground-beef-enchiladas-one-pan-meal-for-the-family/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
